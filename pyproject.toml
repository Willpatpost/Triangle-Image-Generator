[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genetic-shape-image-generator"
version = "2.4.0"
description = "Approximate images with an optimized genetic algorithm and primitive shapes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Poston", email = "willpatpost@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
acceleration = ["numba>=0.61"]
dev = ["build>=1.2"]

[project.gui-scripts]
genetic-shape-image = "app:main"

[project.urls]
Repository = "https://github.com/Willpatpost/Triangle-Image-Generator"

[tool.setuptools]
packages = ["core"]
py-modules = ["app", "gui_state"]
